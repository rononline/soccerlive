version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns:
          - "*"
    # pytest and pytest-asyncio are exact-pinned to the versions that
    # pytest-homeassistant-custom-component requires (==). Dependabot kept
    # grouping an independent pytest/pytest-asyncio bump that phacc doesn't
    # support yet, so the real HA test job failed to resolve (ResolutionImpossible)
    # every week. Ignore them here: they move only together with phacc, so when
    # phacc is bumped we align these pins by hand to match its new requirement.
    ignore:
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      # python-dateutil 4.0.0 is a major bump that sent the real HA test job's
      # dependency resolution "too deep" (a 40+ min backtrack against the HA
      # tree) and would need API vetting anyway. Keep taking minor/patch updates
      # within the current major; the next major is bumped by hand after review.
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
